name: перевірки

# 32 перевірки чекера скілів, синхронність спільних контрактів і конвейєр .docx
# запускались тільки коли хтось згадував. Тепер — на кожен push і кожен PR.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Спільні контракти синхронні
        run: ./scripts/check-shared.sh

      - name: SKILL.md тримають конвенції дому
        run: ./scripts/check-skills.sh

      - name: Конвейєр .docx — фікстури і негативні кейси
        run: ./scripts/test-docx.sh

      - name: Манифести узгоджені
        run: ./scripts/check-manifests.sh

      - name: Установка з клону несе скіли
        run: ./scripts/verify-install.sh

      - name: Клієнтських даних у репозиторії немає
        run: |
          python3 - <<'PY'
          import glob, re, sys
          # робочі артефакти з даними замовників у git не потрапляють (registers.md §5а)
          pats = ['журнал_продажу_*', 'досьє_передачі_*', 'КП_*.docx', 'розриви_*.docx',
                  'оцінка_проєкту_*.docx', 'оцінка_дискавері_*.docx', 'знімок_демо_*',
                  'лист_після_*', 'аргументація_захисту_*', 'підсумок_захисту_*',
                  'аналіз_втрат_*', 'розморозка_*', 'анкета_*.docx']
          found = [f for p in pats for f in glob.glob(f'**/{p}', recursive=True)]
          for f in found: print('✗ артефакт із даними замовника в репозиторії:', f)

          # ПІБ у прикладах: роль у дужках можна, імʼя — ні (skill_conventions §1)
          import re
          name_like = re.compile(r'(?<![А-ЯІЇЄҐа-яіїєґ])(?:[А-ЯІЇЄҐ][а-яіїєґ]{2,}\s+[А-ЯІЇЄҐ][а-яіїєґ]{2,}(?:енко|ук|юк|ський|ська|ов|ова|ін|іна|ій|ко))')
          leaks = []
          for f in glob.glob('shared/examples/*.md'):
              for n, line in enumerate(open(f, encoding='utf-8'), 1):
                  if name_like.search(line):
                      leaks.append(f'{f}:{n}')
          for l in leaks: print('✗ схоже на ПІБ у довіднику прикладів:', l)
          bad = found or leaks
          print('клієнтські дані:', 'ок' if not bad else 'порушення')
          sys.exit(1 if bad else 0)
          PY
